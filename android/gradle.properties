org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# R8 "full mode" is the default from AGP 8.0 onward. It is stricter than
# compat mode in ways that hurt Gson-backed plugins specifically: it honours
# -keepattributes only for classes that ALSO carry a -keep rule, it assumes any
# class not explicitly kept is never reflected on, and it strips no-arg
# constructors it believes are unreachable.
#
# flutter_local_notifications leans on all three when the alarm receiver
# rehydrates a scheduled azan from JSON, hours after the app process died. The
# rules in app/proguard-rules.pro are written to survive full mode, but the
# failure mode if they miss anything is a prayer app that silently stops
# calling the adhan at 5am and no crash to point at it. Not a trade worth
# taking for a few hundred KB.
#
# To re-enable: delete this line, run `flutter build apk --release`, install,
# and confirm a scheduled azan actually fires before shipping.
android.enableR8.fullMode=false

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
